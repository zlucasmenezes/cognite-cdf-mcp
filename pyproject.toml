[project]
name = "cognite-cdf-mcp"
version = "0.1.0"
description = "MCP server for Cognite Data Fusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cognite-sdk>=7.0.0",
    "mcp[cli]>=1.2.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cognite-cdf-mcp = "cognite_cdf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognite_cdf_mcp"]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
