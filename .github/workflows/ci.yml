name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Import MCP server
        run: |
          uv run python -c "from cognite_cdf_mcp.server import mcp; print(len(mcp._tool_manager.list_tools()), 'tools')"

      - name: Pytest
        run: uv run pytest -q
